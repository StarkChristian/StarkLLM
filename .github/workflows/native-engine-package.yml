name: Engine package for Windows (no Docker)

# Roadmap phase 2: builds the StarkLLM engine as one zip that runs without Docker and without an installed Python:
#   runtime\   the embeddable Python 3.11 from python.org with the backend's packages in Lib\site-packages
#   backend\   the backend code and serve_native.py
#   ui\        the built web UI (served by the backend)
#   tesseract\ Tesseract OCR (UB Mannheim's signed Windows build) with German, English and orientation data
#   models\    the search reranker's model (the Docker image ships it too), so nothing is fetched on the user's PC
# Then it unpacks the zip into a new folder the way the desktop app will (tar.exe, part of Windows) and starts the
# engine from it, with Python not on PATH and fully offline, to show the package needs nothing else. It also lists
# every program file (.exe, .dll, .pyd) with its Authenticode signature: what Smart App Control will look at.

on:
  pull_request:
    paths: ['backend/**', 'frontend/**', '.github/workflows/native-engine-package.yml']
  workflow_dispatch:
  workflow_call:   # the end-to-end test (native-desktop-e2e.yml) builds the package first
  release:
    types: [published]

env:
  PYTHON_EMBED: https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip
  # Tesseract for Windows as recommended by the Tesseract project, signed by Universitaet Mannheim. Pinned by hash.
  TESSERACT_SETUP: https://github.com/UB-Mannheim/tesseract/releases/download/v5.4.0.20240606/tesseract-ocr-w64-setup-5.4.0.20240606.exe
  TESSERACT_SETUP_SHA256: c885fff6998e0608ba4bb8ab51436e1c6775c2bafc2559a19b423e18678b60c9
  # German model from tessdata_fast, the same file the Docker engine gets from Debian's tesseract-ocr-deu
  TESSDATA_DEU: https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/87416418657359cb625c412a48b6e1d6d41c29bd/deu.traineddata
  TESSDATA_DEU_SHA256: 19d219bbb6672c869d20a9636c6816a81eb9a71796cb93ebe0cb1530e2cdb22d

permissions:
  contents: write   # attach the zip to a published release

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # the same Python version as the embeddable one, only to install the packages into the package folder
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Embeddable Python
        shell: pwsh
        run: |
          $pkg = "$env:RUNNER_TEMP\starkllm-engine"
          New-Item -ItemType Directory -Force "$pkg\runtime" | Out-Null
          Invoke-WebRequest $env:PYTHON_EMBED -OutFile "$env:RUNNER_TEMP\embed.zip"
          Expand-Archive "$env:RUNNER_TEMP\embed.zip" "$pkg\runtime"
          # python311._pth replaces sys.path: the standard library, the packages and the backend code; "import site"
          # lets the packages register themselves. PYTHONPATH and an installed Python are ignored.
          Set-Content "$pkg\runtime\python311._pth" "python311.zip`r`n.`r`nLib\site-packages`r`n..\backend`r`nimport site"
          "PKG=$pkg" | Out-File -Append $env:GITHUB_ENV

      - name: Backend packages into the package
        shell: pwsh
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet --no-compile --target "$env:PKG\runtime\Lib\site-packages" -r backend/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "pip install failed ($LASTEXITCODE)" }
          # scripts (uvicorn.exe, ...) are not used: the engine starts with serve_native.py
          Remove-Item -Recurse -Force "$env:PKG\runtime\Lib\site-packages\bin" -ErrorAction SilentlyContinue

      - name: Leave out what the engine never loads (about 110 MB)
        shell: pwsh
        run: |
          # Each folder is only imported by code StarkLLM does not run; the next step proves the parts that stay work.
          #   kubernetes        ChromaDB requires it for its distributed server (segment_directory); the local database
          #                     StarkLLM uses never imports it
          #   piper\hebrew      Piper's Hebrew voices (loaded only for a Hebrew voice; StarkLLM ships none). Arabic
          #                     (piper\tashkeel) stays for the planned Arabic voice
          #   test folders      pandas\tests, numpy\tests, chromadb\test: the projects' own test suites
          # The licences (*.dist-info) stay in the package.
          $sp = "$env:PKG\runtime\Lib\site-packages"
          $before = (Get-ChildItem $env:PKG -Recurse -File | Measure-Object Length -Sum).Sum
          foreach ($d in 'kubernetes', 'piper\hebrew', 'pandas\tests', 'numpy\tests', 'chromadb\test') {
            if (-not (Test-Path "$sp\$d")) { throw "expected $d in the package (did a new version move it? check before removing anything else)" }
            Remove-Item -Recurse -Force "$sp\$d"
          }
          $after = (Get-ChildItem $env:PKG -Recurse -File | Measure-Object Length -Sum).Sum
          "left out: $([math]::Round(($before - $after) / 1MB)) MB"

      - name: What stays still works (local database, read-aloud, PDF, voice input)
        shell: pwsh
        run: |
          $py = "$env:PKG\runtime\python.exe"
          $db = "$env:RUNNER_TEMP\chroma-check"
          $code = @"
          import chromadb
          c = chromadb.PersistentClient(path=r'$db')
          col = c.get_or_create_collection('check')
          col.add(ids=['1', '2'], documents=['Rechnung Stadtwerke', 'invoice'], embeddings=[[0.1, 0.2, 0.3], [0.3, 0.2, 0.1]])
          assert col.count() == 2
          r = col.query(query_embeddings=[[0.1, 0.2, 0.3]], n_results=1)
          assert r['ids'][0] == ['1'], r
          from piper import PiperVoice
          import fitz, faster_whisper, av, pandas, numpy
          print('local database, piper, PDF, voice input and pandas load without the removed parts')
          "@
          & $py -c $code
          if ($LASTEXITCODE -ne 0) { throw "a part the engine needs does not load ($LASTEXITCODE)" }

      - name: Search reranker model into the package
        shell: pwsh
        run: |
          # the same model the Docker image ships (backend/Dockerfile); serve_native.py points the engine at models\
          & "$env:PKG\runtime\python.exe" -c "from flashrank import Ranker; Ranker(model_name='ms-marco-TinyBERT-L-2-v2', cache_dir=r'$env:PKG\models')"
          if ($LASTEXITCODE -ne 0) { throw "the reranker model could not be fetched ($LASTEXITCODE)" }
          if (-not (Test-Path "$env:PKG\models\ms-marco-TinyBERT-L-2-v2")) { throw 'the reranker model is missing' }
          Get-ChildItem "$env:PKG\models" -File -Filter *.zip | Remove-Item -Force
          "models: $([math]::Round(((Get-ChildItem "$env:PKG\models" -Recurse -File | Measure-Object Length -Sum).Sum) / 1MB)) MB"

      - name: Backend code and web UI into the package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:PKG\backend" | Out-Null
          Copy-Item -Recurse backend/app, backend/alembic, backend/alembic.ini, backend/serve_native.py "$env:PKG\backend"
          Get-ChildItem "$env:PKG\backend" -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force
          Push-Location frontend
          npm ci --no-audit --no-fund
          npm run build
          Pop-Location
          Copy-Item -Recurse frontend/dist "$env:PKG\ui"
          $version = (Select-String -Path backend/app/core/config.py -Pattern 'VERSION: str = "([^"]+)"').Matches[0].Groups[1].Value
          @{ version = $version; commit = "$env:GITHUB_SHA"; python = '3.11.9' } | ConvertTo-Json | Set-Content "$env:PKG\engine.json"
          "VERSION=$version" | Out-File -Append $env:GITHUB_ENV

      - name: Tesseract (OCR) into the package
        shell: pwsh
        run: |
          $setup = "$env:RUNNER_TEMP\tesseract-setup.exe"
          Invoke-WebRequest $env:TESSERACT_SETUP -OutFile $setup
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:TESSERACT_SETUP_SHA256) { throw "Tesseract setup has hash $hash, expected $env:TESSERACT_SETUP_SHA256" }
          # The pinned SHA-256 above is what makes this exact file trusted. The signature is checked as well: it must be
          # Universitaet Mannheim's and intact. Mannheim's certificate expired on 2023-12-09 and the 5.4.0 setup carries
          # no timestamp, so Windows now reports the chain as "NotTimeValid"; that one finding (and only that one) is
          # accepted and logged. Any other problem (another signer, a changed file, an untrusted chain) stops the build.
          # Smart App Control sees such a file as unsigned: whether we sign Tesseract ourselves is decided by the test on
          # a Windows 11 PC (owner decision 2026-11-16).
          $sig = Get-AuthenticodeSignature $setup
          if (-not $sig.SignerCertificate -or $sig.SignerCertificate.Subject -notmatch 'Mannheim') {
            throw "Tesseract setup is not signed by Universitaet Mannheim: $($sig.Status) $($sig.SignerCertificate.Subject)"
          }
          if ($sig.Status -ne 'Valid') {
            $chain = New-Object System.Security.Cryptography.X509Certificates.X509Chain
            $chain.ChainPolicy.RevocationMode = 'NoCheck'
            $null = $chain.Build($sig.SignerCertificate)
            $problems = @($chain.ChainStatus | ForEach-Object { "$($_.Status)" } | Sort-Object -Unique)
            "chain: $(($chain.ChainStatus | ForEach-Object { "$($_.Status): $($_.StatusInformation.Trim())" }) -join '; ')"
            "certificate valid $($sig.SignerCertificate.NotBefore) to $($sig.SignerCertificate.NotAfter), issuer $($sig.SignerCertificate.Issuer), timestamp: $($sig.TimeStamperCertificate.Subject)"
            $onlyExpired = $problems.Count -gt 0 -and -not ($problems | Where-Object { $_ -notin 'NotTimeValid', 'NotTimeNested' })
            if ($sig.Status -eq 'HashMismatch' -or -not $onlyExpired) {
              throw "Tesseract setup signature: $($sig.Status) ($($sig.StatusMessage)), chain: $($problems -join ', ')"
            }
            "::warning::Tesseract setup: Mannheim's signature is intact but its certificate expired $($sig.SignerCertificate.NotAfter) (no timestamp); accepted because the file matches the pinned SHA-256"
          }
          $x = "$env:RUNNER_TEMP\tesseract-x"
          7z x -y "-o$x" $setup | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z could not unpack the Tesseract setup ($LASTEXITCODE)" }
          # only what tesseract.exe loads (found with objdump); the training tools and their GUI libraries stay out
          $files = 'tesseract.exe', 'libtesseract-5.dll', 'libarchive-13.dll', 'libleptonica-6.dll', 'libtiff-6.dll',
            'libgcc_s_seh-1.dll', 'libstdc++-6.dll', 'libwinpthread-1.dll', 'libb2-1.dll', 'libbz2-1.dll',
            'libcrypto-3-x64.dll', 'libexpat-1.dll', 'libiconv-2.dll', 'liblz4.dll', 'liblzma-5.dll', 'zlib1.dll',
            'libzstd.dll', 'libgif-7.dll', 'libjpeg-8.dll', 'libopenjp2-7.dll', 'libpng16-16.dll', 'libwebp-7.dll',
            'libwebpmux-3.dll', 'libdeflate.dll', 'libjbig-0.dll', 'libLerc.dll', 'libsharpyuv-0.dll'
          $t = "$env:PKG\tesseract"
          New-Item -ItemType Directory -Force "$t\tessdata" | Out-Null
          foreach ($f in $files) { Copy-Item "$x\$f" $t }
          Copy-Item "$x\tessdata\eng.traineddata", "$x\tessdata\osd.traineddata", "$x\tessdata\pdf.ttf" "$t\tessdata"
          Copy-Item -Recurse "$x\tessdata\configs" "$t\tessdata"
          Invoke-WebRequest $env:TESSDATA_DEU -OutFile "$t\tessdata\deu.traineddata"
          $hash = (Get-FileHash "$t\tessdata\deu.traineddata" -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:TESSDATA_DEU_SHA256) { throw "deu.traineddata has hash $hash, expected $env:TESSDATA_DEU_SHA256" }
          Copy-Item -Recurse "$x\doc" "$t\doc"   # LICENSE (Apache-2.0), AUTHORS
          if (-not (Test-Path "$t\doc\LICENSE")) { throw 'the Tesseract license is missing' }
          # it must run from its folder alone: only Windows itself on PATH, so no DLL is borrowed from Git or MSYS
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $env:TESSDATA_PREFIX = "$t\tessdata"
          $langs = & "$t\tesseract.exe" --list-langs 2>&1
          if ($LASTEXITCODE -ne 0) { throw "tesseract.exe does not start from the package: $langs" }
          foreach ($l in 'deu', 'eng', 'osd') { if (-not ($langs -match "^$l$")) { throw "language $l missing: $langs" } }
          "tesseract: $((Get-ChildItem $t -Recurse -File | Measure-Object Length -Sum).Sum / 1MB) MB, languages: $($langs -join ' ')"

      - name: Zip
        shell: pwsh
        run: |
          $mb = [math]::Round(((Get-ChildItem $env:PKG -Recurse -File | Measure-Object Length -Sum).Sum) / 1MB)
          "unpacked: $mb MB"
          $zip = "StarkLLM-engine-v$env:VERSION-win-x64.zip"
          7z a -tzip -mx=7 $zip "$env:PKG\*" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z failed ($LASTEXITCODE)" }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Set-Content "$zip.sha256"
          "zip: $zip $([math]::Round((Get-Item $zip).Length / 1MB)) MB, sha256 $hash"
          "ZIP=$zip" | Out-File -Append $env:GITHUB_ENV

      - name: The package runs on its own
        shell: pwsh
        run: |
          # no Python, Git or MSYS on PATH and a new folder, like on a user's PC
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          $dir = "$env:RUNNER_TEMP\unpacked"
          New-Item -ItemType Directory -Force $dir | Out-Null
          tar.exe -xf $env:ZIP -C $dir
          if ($LASTEXITCODE -ne 0) { throw "tar could not unpack the zip ($LASTEXITCODE)" }
          $home2 = "$env:RUNNER_TEMP\user-StarkLLM"
          New-Item -ItemType Directory -Force $home2, "$env:RUNNER_TEMP\kb" | Out-Null
          $env:STARKLLM_STATIC_DIR = "$dir\ui"
          $env:KB_DATA_DIR = "$env:RUNNER_TEMP\kb"
          $env:OLLAMA_BASE_URL = 'http://127.0.0.1:11434'
          $env:SECRET_KEY = 'ci-only-secret'
          # started the way the desktop app starts it when "fully offline" is on: nothing may leave this PC
          $env:STARKLLM_OFFLINE = '1'
          $started = Get-Date
          $p = Start-Process "$dir\runtime\python.exe" -ArgumentList "$dir\backend\serve_native.py", '--port', '8765' -WorkingDirectory $home2 -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\engine.out" -RedirectStandardError "$env:RUNNER_TEMP\engine.err"
          $ok = $false
          for ($i = 0; $i -lt 120; $i++) {
            if ($p.HasExited) { break }
            try { $h = Invoke-RestMethod http://127.0.0.1:8765/health; $ok = $true; break } catch { Start-Sleep 2 }
          }
          Get-Content "$env:RUNNER_TEMP\engine.err" -Tail 30
          if (-not $ok) { throw 'the engine from the package did not answer' }
          "answered after $([math]::Round(((Get-Date) - $started).TotalSeconds)) s: $($h | ConvertTo-Json -Compress)"
          $page = Invoke-WebRequest http://127.0.0.1:8765/ -UseBasicParsing
          if ($page.Content -notmatch '<title>StarkLLM</title>') { throw 'the web UI is not served' }
          if (-not (Test-Path "$home2\data\starkllm.db")) { throw 'the database is not in the user folder' }
          if (-not $h.ocr.available -or $h.ocr.languages -notcontains 'deu') { throw "the engine has no German OCR: $($h.ocr | ConvertTo-Json -Compress)" }
          "python used: $((Get-Process -Id $p.Id).Path)"
          "the engine runs from the package"
          # OCR from the package reads a German sample exactly
          $env:STARKLLM_TESSERACT = "$dir\tesseract\tesseract.exe"
          $env:TESSDATA_PREFIX = "$dir\tesseract\tessdata"
          $env:PYTHONIOENCODING = 'utf-8'
          Push-Location $home2
          & "$dir\runtime\python.exe" -m app.services.ocr_service
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "the OCR self-test failed ($code)" }
          Stop-Process -Id $p.Id -Force
          # offline from the first start: the engine did not even try to reach the internet (the network layer records
          # every attempt, blocked ones too, in data\network_log.jsonl; connections to this PC are not listed)
          Push-Location $home2
          $offline = & "$dir\runtime\python.exe" -c "from app.core import netguard; print(netguard.is_offline())"
          Pop-Location
          if ($offline -ne 'True') { throw "the engine's network layer does not see the offline switch ($offline)" }
          $tried = if (Test-Path "$home2\data\network_log.jsonl") { Get-Content "$home2\data\network_log.jsonl" | Where-Object { $_.Trim() } } else { @() }
          if ($tried) { $tried; throw 'the engine tried to reach the internet while fully offline' }
          'fully offline: no connection attempt'
          # voice: Piper speaks German with the built-in voice and Whisper reads it back (its model is fetched once, as
          # in Docker), run from another folder than the code, like the desktop app does
          $env:STARKLLM_OFFLINE = ''
          $env:PYTHONIOENCODING = 'utf-8'
          $voice = "$env:RUNNER_TEMP\voice-test"
          New-Item -ItemType Directory -Force $voice | Out-Null
          Push-Location $voice
          & "$dir\runtime\python.exe" -m app.services.voice_service
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "the voice self-test failed ($code)" }
          # one more OCR language the way Settings > Reading photos and scans adds it: one file downloaded into the
          # user's data folder, read together with the bundled English and German (Windows without the right to make
          # links gets copies of the bundled files), with the package's Tesseract
          $ocr = "$env:RUNNER_TEMP\ocr-language-test"
          New-Item -ItemType Directory -Force $ocr | Out-Null
          Push-Location $ocr
          & "$dir\runtime\python.exe" -c "from app.services import ocr_languages as o; from app.services.ocr_service import OcrService; o.install('fra'); o.save(['eng', 'deu', 'fra']); st = OcrService().status(); print(st); assert set(st['languages']) >= {'eng', 'deu', 'fra'}, st"
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "a downloaded OCR language is not read ($code)" }
          if (-not (Test-Path "$ocr\data\tessdata\deu.traineddata")) { throw 'the bundled German data is not next to the downloaded pack' }

      - name: Program files and their signatures (Smart App Control)
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\unpacked"
          $rows = Get-ChildItem $dir -Recurse -File -Include *.exe, *.dll, *.pyd | ForEach-Object {
            $s = Get-AuthenticodeSignature $_.FullName
            [pscustomobject]@{
              File = $_.FullName.Substring($dir.Length + 1); Type = $_.Extension.ToLower(); KB = [math]::Round($_.Length / 1KB)
              Status = "$($s.Status)"; Signer = if ($s.SignerCertificate) { ($s.SignerCertificate.Subject -split ',')[0] -replace '^CN=', '' } else { '' }
            }
          }
          $rows | Export-Csv -NoTypeInformation -Encoding utf8 "$env:RUNNER_TEMP\engine-binaries.csv"
          $zipMB = [math]::Round((Get-Item $env:ZIP).Length / 1MB, 1)
          $unpackedMB = [math]::Round(((Get-ChildItem $dir -Recurse -File | Measure-Object Length -Sum).Sum) / 1MB, 1)
          $files = (Get-ChildItem $dir -Recurse -File).Count
          $signed = @($rows | Where-Object Status -eq 'Valid')
          $summary = @(
            "### Engine package $env:ZIP", '',
            "zip: $zipMB MB, unpacked: $unpackedMB MB in $files files", '',
            "program files: $($rows.Count) (exe $(@($rows | Where-Object Type -eq '.exe').Count), dll $(@($rows | Where-Object Type -eq '.dll').Count), pyd $(@($rows | Where-Object Type -eq '.pyd').Count))",
            "Authenticode-signed (Valid): $($signed.Count), not signed: $($rows.Count - $signed.Count)", '',
            '| signer | files |', '|---|---|'
          ) + ($rows | Group-Object Signer | Sort-Object Count -Descending | ForEach-Object { "| $(if ($_.Name) { $_.Name } else { '(not signed)' }) | $($_.Count) |" }) + @(
            '', '| unsigned by folder | files |', '|---|---|'
          ) + ($rows | Where-Object Status -ne 'Valid' | Group-Object { ($_.File -split '\\')[0..3] -join '\' } | Sort-Object Count -Descending | Select-Object -First 25 | ForEach-Object { "| $($_.Name) | $($_.Count) |" })
          $summary -join "`n" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          $summary -join "`n" | Set-Content "$env:RUNNER_TEMP\engine-binaries.md"

      - uses: actions/upload-artifact@v4
        with:
          name: starkllm-engine-binaries
          path: |
            ${{ runner.temp }}/engine-binaries.csv
            ${{ runner.temp }}/engine-binaries.md
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: starkllm-engine-win-x64
          path: |
            ${{ env.ZIP }}
            ${{ env.ZIP }}.sha256
          retention-days: 14

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: gh release upload "${{ github.event.release.tag_name }}" $env:ZIP "$env:ZIP.sha256" --clobber

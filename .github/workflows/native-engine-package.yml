name: Engine package for Windows (no Docker)

# Roadmap phase 2: builds the StarkLLM engine as one zip that runs without Docker and without an installed Python:
#   runtime\   the embeddable Python 3.11 from python.org with the backend's packages in Lib\site-packages
#   backend\   the backend code and serve_native.py
#   ui\        the built web UI (served by the backend)
#   models\    the search reranker's model (the Docker image ships it too), so nothing is fetched on the user's PC
# Then it unpacks the zip into a new folder the way the desktop app will (tar.exe, part of Windows) and starts the
# engine from it, with Python not on PATH and fully offline, to show the package needs nothing else. It also lists
# every program file (.exe, .dll, .pyd) with its Authenticode signature: what Smart App Control will look at.

on:
  pull_request:
    paths: ['backend/**', 'frontend/**', '.github/workflows/native-engine-package.yml']
  workflow_dispatch:
  workflow_call:   # the end-to-end test (native-desktop-e2e.yml) builds the package first
  release:
    types: [published]

env:
  PYTHON_EMBED: https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip

permissions:
  contents: write   # attach the zip to a published release

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # the same Python version as the embeddable one, only to install the packages into the package folder
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Embeddable Python
        shell: pwsh
        run: |
          $pkg = "$env:RUNNER_TEMP\starkllm-engine"
          New-Item -ItemType Directory -Force "$pkg\runtime" | Out-Null
          Invoke-WebRequest $env:PYTHON_EMBED -OutFile "$env:RUNNER_TEMP\embed.zip"
          Expand-Archive "$env:RUNNER_TEMP\embed.zip" "$pkg\runtime"
          # python311._pth replaces sys.path: the standard library, the packages and the backend code; "import site"
          # lets the packages register themselves. PYTHONPATH and an installed Python are ignored.
          Set-Content "$pkg\runtime\python311._pth" "python311.zip`r`n.`r`nLib\site-packages`r`n..\backend`r`nimport site"
          "PKG=$pkg" | Out-File -Append $env:GITHUB_ENV

      - name: Backend packages into the package
        shell: pwsh
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet --no-compile --target "$env:PKG\runtime\Lib\site-packages" -r backend/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "pip install failed ($LASTEXITCODE)" }
          # scripts (uvicorn.exe, ...) are not used: the engine starts with serve_native.py
          Remove-Item -Recurse -Force "$env:PKG\runtime\Lib\site-packages\bin" -ErrorAction SilentlyContinue

      - name: Search reranker model into the package
        shell: pwsh
        run: |
          # the same model the Docker image ships (backend/Dockerfile); serve_native.py points the engine at models\
          & "$env:PKG\runtime\python.exe" -c "from flashrank import Ranker; Ranker(model_name='ms-marco-TinyBERT-L-2-v2', cache_dir=r'$env:PKG\models')"
          if ($LASTEXITCODE -ne 0) { throw "the reranker model could not be fetched ($LASTEXITCODE)" }
          if (-not (Test-Path "$env:PKG\models\ms-marco-TinyBERT-L-2-v2")) { throw 'the reranker model is missing' }
          Get-ChildItem "$env:PKG\models" -File -Filter *.zip | Remove-Item -Force
          "models: $([math]::Round(((Get-ChildItem "$env:PKG\models" -Recurse -File | Measure-Object Length -Sum).Sum) / 1MB)) MB"

      - name: Backend code and web UI into the package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:PKG\backend" | Out-Null
          Copy-Item -Recurse backend/app, backend/alembic, backend/alembic.ini, backend/serve_native.py "$env:PKG\backend"
          Get-ChildItem "$env:PKG\backend" -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force
          Push-Location frontend
          npm ci --no-audit --no-fund
          npm run build
          Pop-Location
          Copy-Item -Recurse frontend/dist "$env:PKG\ui"
          $version = (Select-String -Path backend/app/core/config.py -Pattern 'VERSION: str = "([^"]+)"').Matches[0].Groups[1].Value
          @{ version = $version; commit = "$env:GITHUB_SHA"; python = '3.11.9' } | ConvertTo-Json | Set-Content "$env:PKG\engine.json"
          "VERSION=$version" | Out-File -Append $env:GITHUB_ENV

      - name: Zip
        shell: pwsh
        run: |
          $mb = [math]::Round(((Get-ChildItem $env:PKG -Recurse -File | Measure-Object Length -Sum).Sum) / 1MB)
          "unpacked: $mb MB"
          $zip = "StarkLLM-engine-v$env:VERSION-win-x64.zip"
          7z a -tzip -mx=7 $zip "$env:PKG\*" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z failed ($LASTEXITCODE)" }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Set-Content "$zip.sha256"
          "zip: $zip $([math]::Round((Get-Item $zip).Length / 1MB)) MB, sha256 $hash"
          "ZIP=$zip" | Out-File -Append $env:GITHUB_ENV

      - name: The package runs on its own
        shell: pwsh
        run: |
          # no Python on PATH and a new folder, like on a user's PC
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch 'Python' }) -join ';'
          $dir = "$env:RUNNER_TEMP\unpacked"
          New-Item -ItemType Directory -Force $dir | Out-Null
          tar.exe -xf $env:ZIP -C $dir
          if ($LASTEXITCODE -ne 0) { throw "tar could not unpack the zip ($LASTEXITCODE)" }
          $home2 = "$env:RUNNER_TEMP\user-StarkLLM"
          New-Item -ItemType Directory -Force $home2, "$env:RUNNER_TEMP\kb" | Out-Null
          $env:STARKLLM_STATIC_DIR = "$dir\ui"
          $env:KB_DATA_DIR = "$env:RUNNER_TEMP\kb"
          $env:OLLAMA_BASE_URL = 'http://127.0.0.1:11434'
          $env:SECRET_KEY = 'ci-only-secret'
          # started the way the desktop app starts it when "fully offline" is on: nothing may leave this PC
          $env:STARKLLM_OFFLINE = '1'
          $started = Get-Date
          $p = Start-Process "$dir\runtime\python.exe" -ArgumentList "$dir\backend\serve_native.py", '--port', '8765' -WorkingDirectory $home2 -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\engine.out" -RedirectStandardError "$env:RUNNER_TEMP\engine.err"
          $ok = $false
          for ($i = 0; $i -lt 120; $i++) {
            if ($p.HasExited) { break }
            try { $h = Invoke-RestMethod http://127.0.0.1:8765/health; $ok = $true; break } catch { Start-Sleep 2 }
          }
          Get-Content "$env:RUNNER_TEMP\engine.err" -Tail 30
          if (-not $ok) { throw 'the engine from the package did not answer' }
          "answered after $([math]::Round(((Get-Date) - $started).TotalSeconds)) s: $($h | ConvertTo-Json -Compress)"
          $page = Invoke-WebRequest http://127.0.0.1:8765/ -UseBasicParsing
          if ($page.Content -notmatch '<title>StarkLLM</title>') { throw 'the web UI is not served' }
          if (-not (Test-Path "$home2\data\starkllm.db")) { throw 'the database is not in the user folder' }
          "python used: $((Get-Process -Id $p.Id).Path)"
          "the engine runs from the package"
          Stop-Process -Id $p.Id -Force
          # offline from the first start: the engine did not even try to reach the internet (the network layer records
          # every attempt, blocked ones too, in data\network_log.jsonl; connections to this PC are not listed)
          if (-not (Get-Content "$home2\data\privacy.json" -Raw | ConvertFrom-Json).offline) { throw 'the engine did not take over the offline switch' }
          $tried = if (Test-Path "$home2\data\network_log.jsonl") { Get-Content "$home2\data\network_log.jsonl" | Where-Object { $_.Trim() } } else { @() }
          if ($tried) { $tried; throw 'the engine tried to reach the internet while fully offline' }
          'fully offline: no connection attempt'
          # voice: Piper speaks German with the built-in voice and Whisper reads it back (its model is fetched once, as
          # in Docker), run from another folder than the code, like the desktop app does
          $env:STARKLLM_OFFLINE = ''
          $env:PYTHONIOENCODING = 'utf-8'
          $voice = "$env:RUNNER_TEMP\voice-test"
          New-Item -ItemType Directory -Force $voice | Out-Null
          Push-Location $voice
          & "$dir\runtime\python.exe" -m app.services.voice_service
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "the voice self-test failed ($code)" }

      - name: Program files and their signatures (Smart App Control)
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\unpacked"
          $rows = Get-ChildItem $dir -Recurse -File -Include *.exe, *.dll, *.pyd | ForEach-Object {
            $s = Get-AuthenticodeSignature $_.FullName
            [pscustomobject]@{
              File = $_.FullName.Substring($dir.Length + 1); Type = $_.Extension.ToLower(); KB = [math]::Round($_.Length / 1KB)
              Status = "$($s.Status)"; Signer = if ($s.SignerCertificate) { ($s.SignerCertificate.Subject -split ',')[0] -replace '^CN=', '' } else { '' }
            }
          }
          $rows | Export-Csv -NoTypeInformation -Encoding utf8 "$env:RUNNER_TEMP\engine-binaries.csv"
          $zipMB = [math]::Round((Get-Item $env:ZIP).Length / 1MB, 1)
          $unpackedMB = [math]::Round(((Get-ChildItem $dir -Recurse -File | Measure-Object Length -Sum).Sum) / 1MB, 1)
          $files = (Get-ChildItem $dir -Recurse -File).Count
          $signed = @($rows | Where-Object Status -eq 'Valid')
          $summary = @(
            "### Engine package $env:ZIP", '',
            "zip: $zipMB MB, unpacked: $unpackedMB MB in $files files", '',
            "program files: $($rows.Count) (exe $(@($rows | Where-Object Type -eq '.exe').Count), dll $(@($rows | Where-Object Type -eq '.dll').Count), pyd $(@($rows | Where-Object Type -eq '.pyd').Count))",
            "Authenticode-signed (Valid): $($signed.Count), not signed: $($rows.Count - $signed.Count)", '',
            '| signer | files |', '|---|---|'
          ) + ($rows | Group-Object Signer | Sort-Object Count -Descending | ForEach-Object { "| $(if ($_.Name) { $_.Name } else { '(not signed)' }) | $($_.Count) |" }) + @(
            '', '| unsigned by folder | files |', '|---|---|'
          ) + ($rows | Where-Object Status -ne 'Valid' | Group-Object { ($_.File -split '\\')[0..3] -join '\' } | Sort-Object Count -Descending | Select-Object -First 25 | ForEach-Object { "| $($_.Name) | $($_.Count) |" })
          $summary -join "`n" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          $summary -join "`n" | Set-Content "$env:RUNNER_TEMP\engine-binaries.md"

      - uses: actions/upload-artifact@v4
        with:
          name: starkllm-engine-binaries
          path: |
            ${{ runner.temp }}/engine-binaries.csv
            ${{ runner.temp }}/engine-binaries.md
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: starkllm-engine-win-x64
          path: |
            ${{ env.ZIP }}
            ${{ env.ZIP }}.sha256
          retention-days: 14

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: gh release upload "${{ github.event.release.tag_name }}" $env:ZIP "$env:ZIP.sha256" --clobber

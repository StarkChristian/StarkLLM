name: StarkLLM without Docker (Windows, end to end)

# Roadmap phase 2. GitHub's Windows machines have no Docker Desktop, like many users' PCs. This installs the app and
# Ollama the way a user would, gives the app the engine package built in this run (instead of the release download),
# and checks that StarkLLM starts by itself without Docker: engine up, web UI loaded, signed in as the local user,
# and an answer from the local model through the engine.

on:
  pull_request:
    paths: ['desktop/**', 'backend/**', 'frontend/**', '.github/workflows/native-desktop-e2e.yml', '.github/workflows/native-engine-package.yml']
  workflow_dispatch:

jobs:
  package:
    uses: ./.github/workflows/native-engine-package.yml
    permissions:
      contents: write   # the package workflow asks for it (it attaches the zip to releases)

  desktop:
    needs: package
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/download-artifact@v4
        with:
          name: starkllm-engine-win-x64
          path: engine-package

      - name: Install Ollama with the app's code ("Install Ollama for me")
        working-directory: desktop
        run: |
          node -e "require('./ollama-install').installOllama({ log: console.log }).then(() => console.log('Ollama installed'), (e) => { console.error(e.message); process.exit(1) })"

      - name: Two small models (the test machine has no GPU)
        shell: pwsh
        run: |
          $ollama = Join-Path $env:LOCALAPPDATA 'Programs\Ollama\ollama.exe'
          if (-not (Get-Process -Name ollama* -ErrorAction SilentlyContinue)) { Start-Process $ollama -ArgumentList 'serve' -WindowStyle Hidden; Start-Sleep 5 }
          & $ollama pull qwen2.5:0.5b
          & $ollama pull nomic-embed-text
          & $ollama list
          # the app keeps a saved choice when the models are installed (desktop/models.js)
          New-Item -ItemType Directory -Force "$env:APPDATA\StarkLLM" | Out-Null
          '{"text":"qwen2.5:0.5b","embedding":"nomic-embed-text","vision":"qwen2.5:0.5b"}' | Set-Content "$env:APPDATA\StarkLLM\models.json"

      - name: Build and install the app (the installer carries the engine package, like a release)
        shell: pwsh
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          $zip = Get-ChildItem ../engine-package/*.zip | Select-Object -First 1
          New-Item -ItemType Directory -Force build/engine-native | Out-Null
          tar.exe -xf $zip.FullName -C build/engine-native
          if ($LASTEXITCODE -ne 0) { throw "tar could not unpack the engine package ($LASTEXITCODE)" }
          npx electron-builder --win nsis --x64 --publish never
          $setup = Get-ChildItem dist/*-Setup.exe | Select-Object -First 1
          "installer: $([math]::Round($setup.Length / 1MB)) MB"
          Start-Process $setup.FullName -ArgumentList '/S', '/currentuser' -Wait
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\StarkLLM\StarkLLM.exe'
          $deadline = (Get-Date).AddMinutes(6)
          while (-not (Test-Path $exe) -and (Get-Date) -lt $deadline) { Start-Sleep 3 }
          if (-not (Test-Path $exe)) { throw 'the app was not installed' }
          if (-not (Test-Path (Join-Path (Split-Path $exe) 'resources\engine-native\runtime\python.exe'))) { throw 'the installed app has no engine package' }
          if (Get-Command docker -ErrorAction SilentlyContinue) { 'note: docker is on PATH' } else { 'no Docker on this machine' }

      - name: StarkLLM starts without Docker
        shell: pwsh
        run: |
          # no STARKLLM_ENGINE_PACKAGE: the app must use the engine the installer brought, without a download
          $env:STARKLLM_UPDATE_CHECK = '0'
          # nobody is there to answer the first-start question (stay online / fully offline)
          $env:STARKLLM_ASK_OFFLINE = '0'
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\StarkLLM\StarkLLM.exe'
          $log = "$env:APPDATA\StarkLLM\engine.log"
          $started = Get-Date
          $app = Start-Process $exe -PassThru
          $deadline = (Get-Date).AddMinutes(20)
          $result = $null
          while ((Get-Date) -lt $deadline) {
            Start-Sleep 10
            if ($app.HasExited) { throw "the app exited with code $($app.ExitCode)" }
            if (Test-Path $log) {
              if (Select-String -Path $log -Pattern '^\S+ Ready\.' -Quiet) { $result = 'ready'; break }
              if (Select-String -Path $log -Pattern 'engine package: |did not start|could not be downloaded' -Quiet) { $result = 'failed'; break }
            }
          }
          Start-Sleep 20
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\native-app.png")
          Get-Content $log
          if (Test-Path "$env:APPDATA\StarkLLM\engine-native.log") { '--- engine-native.log'; Get-Content "$env:APPDATA\StarkLLM\engine-native.log" -Tail 40 }
          if ($result -ne 'ready') { throw "StarkLLM did not get ready without Docker ($result)" }
          "ready after $([math]::Round(((Get-Date) - $started).TotalSeconds)) s"
          $h = Invoke-RestMethod http://127.0.0.1:5173/health
          "health: $($h | ConvertTo-Json -Compress)"
          if ($h.build -notlike 'native-*') { throw 'the engine answering is not the engine without Docker' }
          if (Select-String -Path $log -Pattern 'downloading the engine package' -Quiet) { throw 'the app downloaded the engine although the installer carries it' }
          $copies = Get-ChildItem "$env:LOCALAPPDATA\StarkLLM\engine" -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^\d+\.\d+\.\d+' }
          if ($copies) { throw "an unpacked engine copy was made: $($copies.FullName -join ', ')" }
          $v = Invoke-RestMethod http://127.0.0.1:5173/api/v1/version
          "version: $($v | ConvertTo-Json -Compress)"
          if ($v.code_runner -ne $false) { throw 'the code runner must be off without Docker' }
          $installDir = Split-Path (Join-Path $env:LOCALAPPDATA 'Programs\StarkLLM\StarkLLM.exe')
          $pyc = Get-ChildItem "$installDir\resources\engine-native" -Recurse -Filter *.pyc -ErrorAction SilentlyContinue | Where-Object { $_.LastWriteTime -gt $started }
          if ($pyc) { throw "Python wrote its cache into the program folder ($($pyc.Count) files), expected under %LOCALAPPDATA%\StarkLLM\engine\pycache" }
          "ENGINE_PID=$((Get-Process python -ErrorAction SilentlyContinue | Select-Object -First 1).Id)" | Out-File -Append $env:GITHUB_ENV

      - name: Signed in as the local user, and the local model answers through the engine
        shell: pwsh
        run: |
          # the same key the desktop app sends (desktop/main.js, backend/app/api/auth.py)
          $secret = (Get-Content "$env:APPDATA\StarkLLM\secret.key" -Raw).Trim()
          $hmac = New-Object System.Security.Cryptography.HMACSHA256
          $hmac.Key = [Text.Encoding]::UTF8.GetBytes($secret)
          $key = -join ($hmac.ComputeHash([Text.Encoding]::UTF8.GetBytes('starkllm-desktop-session')) | ForEach-Object { $_.ToString('x2') })
          $s = Invoke-RestMethod -Method Post http://127.0.0.1:5173/api/v1/auth/desktop-session -Headers @{ 'X-Desktop-Key' = $key }
          if (-not $s.access_token) { throw 'no local session' }
          'signed in as the local user'
          $body = @{ model = 'qwen2.5:0.5b'; messages = @(@{ role = 'user'; content = 'Reply with the single word: ready' }) } | ConvertTo-Json -Depth 4
          # the OpenAI-compatible API is for other apps: switched on and given a key the way Settings > Other apps does it
          $session = @{ Authorization = "Bearer $($s.access_token)" }
          Invoke-RestMethod -Method Put http://127.0.0.1:5173/api/v1/connections -Headers $session -ContentType 'application/json' -Body '{"enabled":true}' | Out-Null
          $appKey = (Invoke-RestMethod -Method Post http://127.0.0.1:5173/api/v1/connections/keys -Headers $session -ContentType 'application/json' -Body '{"name":"native e2e"}').key
          "::add-mask::$appKey"
          "OTHER_APPS_KEY=$appKey" | Out-File -Append $env:GITHUB_ENV
          $r = Invoke-RestMethod -Method Post http://127.0.0.1:5173/v1/chat/completions -Headers @{ Authorization = "Bearer $appKey" } -ContentType 'application/json' -Body $body -TimeoutSec 300
          "model answer: $($r.choices[0].message.content)"
          if (-not $r.choices[0].message.content) { throw 'no answer from the model' }

      - name: Fully offline switch, protection at rest, encrypted search index and an encrypted backup without Docker
        shell: pwsh
        run: |
          # the same keys the desktop app derives from the engine's secret (engine-offline.js, data-key.js)
          $api = 'http://127.0.0.1:5173'
          $secret = (Get-Content "$env:APPDATA\StarkLLM\secret.key" -Raw).Trim()
          function Hmac($text) { $h = New-Object System.Security.Cryptography.HMACSHA256; $h.Key = [Text.Encoding]::UTF8.GetBytes($secret); -join ($h.ComputeHash([Text.Encoding]::UTF8.GetBytes($text)) | ForEach-Object { $_.ToString('x2') }) }
          $desktopKey = Hmac 'starkllm-desktop-session'
          $internal = Hmac 'starkllm-protection-unlock'
          $s = Invoke-RestMethod -Method Post "$api/api/v1/auth/desktop-session" -Headers @{ 'X-Desktop-Key' = $desktopKey }
          $auth = @{ Authorization = "Bearer $($s.access_token)" }

          # "fully offline" of the desktop app reaches the engine without Docker (/privacy/offline/desktop) and back
          $o = Invoke-RestMethod -Method Put "$api/api/v1/privacy/offline/desktop" -Headers @{ 'X-Desktop-Key' = $desktopKey } -ContentType 'application/json' -Body '{"enabled":true}'
          if (-not $o.offline) { throw "the engine did not go offline: $($o | ConvertTo-Json -Compress)" }
          if (-not (Invoke-RestMethod "$api/api/v1/privacy/status" -Headers $auth).offline) { throw 'the engine does not report offline' }
          $o = Invoke-RestMethod -Method Put "$api/api/v1/privacy/offline/desktop" -Headers @{ 'X-Desktop-Key' = $desktopKey } -ContentType 'application/json' -Body '{"enabled":false}'
          if ($o.offline) { throw 'the engine stayed offline' }
          'fully offline switch: on and off through the desktop key'

          # a note in a workspace, so there is something to protect
          $ws = Invoke-RestMethod -Method Post "$api/api/v1/workspaces/" -Headers $auth -ContentType 'application/json' -Body '{"name":"Native e2e"}'
          $note = @{ title = 'Rechnung'; content = 'Rechnung Nr. 4711 der Stadtwerke Aachen, zahlbar bis 3. Januar 2027: 128,40 EUR.' } | ConvertTo-Json
          Invoke-RestMethod -Method Post "$api/api/v1/documents/$($ws.id)/ingest-note" -Headers $auth -ContentType 'application/json; charset=utf-8' -Body ([Text.Encoding]::UTF8.GetBytes($note)) -TimeoutSec 300 | Out-Null

          # protection at rest: the desktop app hands the key over in memory, then the data is migrated
          $key = [Convert]::ToBase64String((1..32 | ForEach-Object { Get-Random -Maximum 256 } | ForEach-Object { [byte]$_ }))
          $u = Invoke-RestMethod -Method Post "$api/api/v1/system/protection/unlock" -Headers @{ 'X-StarkLLM-Internal' = $internal } -ContentType 'application/json' -Body (@{ key = $key } | ConvertTo-Json)
          if (-not $u.key_available) { throw 'the engine did not take the key' }
          function WaitIdle { for ($i = 0; $i -lt 90; $i++) { $st = Invoke-RestMethod "$api/api/v1/system/protection/status" -Headers $auth; if (-not $st.running) { return $st }; Start-Sleep 2 }; throw 'the migration did not finish' }
          # the note is indexed in the background (embedding by the local model): the plan waits until that is done
          for ($i = 0; $i -lt 60; $i++) {
            $plan = Invoke-RestMethod -Method Post "$api/api/v1/system/protection/plan" -Headers $auth -ContentType 'application/json' -Body '{"direction":"enable"}'
            if ($plan.ok -or -not ($plan.problems -match 'still being processed')) { break }
            Start-Sleep 5
          }
          if (-not $plan.ok) { throw "protection cannot be turned on: $($plan | ConvertTo-Json -Depth 5 -Compress)" }
          Invoke-RestMethod -Method Post "$api/api/v1/system/protection/migrate" -Headers $auth -ContentType 'application/json' -Body '{"direction":"enable"}' | Out-Null
          Start-Sleep 2
          $st = WaitIdle
          "protection: $($st | ConvertTo-Json -Depth 5 -Compress)"
          if (-not $st.enabled) { throw 'protection at rest did not switch on' }
          Invoke-RestMethod -Method Post "$api/api/v1/system/protection/vectors/migrate" -Headers $auth -ContentType 'application/json' -Body '{"mode":"secure"}' | Out-Null
          Start-Sleep 2
          $st = WaitIdle
          if ($st.vector_mode -ne 'secure') { throw "the encrypted search index is not in use: $($st | ConvertTo-Json -Depth 5 -Compress)" }
          'protection at rest and the encrypted search index are on'

          # the protected note is still found, and an encrypted backup is made and restore-tested inside the engine
          $body = @{ model = 'qwen2.5:0.5b'; workspace_id = $ws.id; messages = @(@{ role = 'user'; content = 'Bis wann ist die Rechnung 4711 zu zahlen?' }) } | ConvertTo-Json -Depth 4
          try {
            $r = Invoke-RestMethod -Method Post "$api/v1/chat/completions" -Headers @{ Authorization = "Bearer $env:OTHER_APPS_KEY" } -ContentType 'application/json' -Body $body -TimeoutSec 300
            "answer with protection on: $($r.choices[0].message.content)"
          } catch { "::warning::chat with protection on failed: $($_.Exception.Message)" }
          $b = Invoke-RestMethod -Method Post "$api/api/v1/system/backup/create" -Headers $auth -ContentType 'application/json' -Body '{"passphrase":"native e2e backup passphrase"}' -TimeoutSec 600
          "backup: $($b | ConvertTo-Json -Depth 6 -Compress)"
          if (-not $b.id) { throw 'no encrypted backup' }

          # the desktop app locks the engine when it quits: protected data is unreadable without the key
          $l = Invoke-RestMethod -Method Post "$api/api/v1/system/protection/lock" -Headers @{ 'X-StarkLLM-Internal' = $internal }
          if ($l.key_available) { throw 'the engine kept the key after lock' }
          'locked again'

      - name: Quitting StarkLLM stops the engine
        shell: pwsh
        run: |
          Get-Process StarkLLM -ErrorAction SilentlyContinue | ForEach-Object { $_.CloseMainWindow() | Out-Null }
          Start-Sleep 15
          Get-Process StarkLLM -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 5
          $left = Get-Process python -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$env:LOCALAPPDATA\StarkLLM\engine\*" }
          if ($left) { $left | Format-Table Id, Path | Out-String; throw 'the engine still runs after StarkLLM quit' }
          'engine stopped with the app'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-desktop-e2e
          path: |
            native-app.png
            ${{ env.APPDATA }}/StarkLLM/engine.log
            ${{ env.APPDATA }}/StarkLLM/engine-native.log
          if-no-files-found: ignore

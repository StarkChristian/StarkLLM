name: chroma diag (temporary)
on:
  push:
    branches: [fix/chroma-hnsw-windows]
    paths: ['.github/workflows/chroma-diag.yml']
jobs:
  loop:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - shell: pwsh
        working-directory: backend
        run: |
          python -m pip install --quiet -r requirements.txt pytest
          $fails = 0
          for ($i = 1; $i -le 6; $i++) {
            python -m pytest -q -p no:cacheprovider tests/test_chroma_store.py tests/test_secure_index_migration.py tests/test_backup_everything.py tests/test_protection_at_rest.py tests/test_encrypted_backup.py 2>&1 | Select-String -Pattern '^(FAILED|E  )|passed|failed' | Select-Object -First 12
            if ($LASTEXITCODE -ne 0) { $fails++ }
          }
          "loop failures: $fails of 6"
          if ($fails) { exit 1 }

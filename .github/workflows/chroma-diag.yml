name: chroma diag (temporary)
on:
  push:
    branches: [fix/chroma-hnsw-windows]
    paths: ['.github/workflows/chroma-diag.yml', '.github/diag/**']
jobs:
  scrub:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - shell: pwsh
        working-directory: backend
        run: |
          python -m pip install --quiet -r requirements.txt pytest
          Copy-Item ../.github/diag/test_scrub_diag.py tests/
          $fails = 0
          $combos = @(
            'tests/test_chroma_store.py tests/test_scrub_diag.py',
            'tests/test_secure_index_migration.py::test_dry_run_counts_and_changes_nothing tests/test_scrub_diag.py',
            'tests/test_secure_index_migration.py::test_plan_needs_protection_on_and_a_key tests/test_scrub_diag.py',
            'tests/test_protection_at_rest.py tests/test_scrub_diag.py')
          foreach ($c in $combos) {
            for ($i = 1; $i -le 4; $i++) {
              "== $c #$i"
              python -m pytest -q -s -p no:cacheprovider $c.Split(' ') 2>&1 | Select-String -Pattern 'DIAG (cleaned|file|log|journal)|FAILED|passed|failed' | Select-Object -First 14
            }
          }

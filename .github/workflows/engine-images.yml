name: Engine images

# Builds the backend and frontend images of a release and publishes them on GitHub Container Registry:
#   ghcr.io/starkchristian/starkllm-backend:<version>, ghcr.io/starkchristian/starkllm-frontend:<version>
# The installed desktop app of that version pulls them instead of building the engine on the user's PC
# (desktop/engine.js, engineImages). Runs when a release is published; can be started by hand for a version.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without "v", e.g. 2.0.7 (the tag v<version> must exist)'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Version
        id: v
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then t="${{ github.event.release.tag_name }}"; else t="v${{ inputs.version }}"; fi
          echo "tag=$t" >> "$GITHUB_OUTPUT"
          echo "version=${t#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.v.outputs.tag }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: ghcr.io/starkchristian/starkllm-backend:${{ steps.v.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/StarkChristian/StarkLLM
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          tags: ghcr.io/starkchristian/starkllm-frontend:${{ steps.v.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/StarkChristian/StarkLLM
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

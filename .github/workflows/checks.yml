name: Checks

# The checks every change goes through (docs/CHANGES.md). Fast, no language model needed:
#   backend   all backend tests, inside the engine image users run (same Python packages and system tools)
#   frontend  the German UI is complete and consistent, and the UI builds
#   languages the repository holds only English and German text (docs/RULES.md, R2)
# Changes to the answers of the model are measured separately with backend/scenarios (see docs/CHANGES.md).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the engine image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          load: true
          tags: starkllm-backend:test
          cache-from: type=gha,scope=checks-backend
          cache-to: type=gha,mode=max,scope=checks-backend
      - name: Tests
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo/backend starkllm-backend:test \
            sh -c "pip install -q pytest && python -m pytest -q -rs tests --ignore=tests/run_rigorous_e2e.py -p no:cacheprovider"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: German UI complete, no hidden translator
        run: node scripts/check-i18n.mjs
      - name: Build
        run: npm run build

  languages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Only English and German in the repository
        run: python3 scripts/check-languages.py

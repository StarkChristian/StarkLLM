name: Checks

# The checks every change goes through (docs/CHANGES.md). Fast, no language model needed:
#   backend   all backend tests, inside the engine image users run (same Python packages and system tools)
#   frontend  the German UI is complete and consistent, and the UI builds
#   languages the repository holds only English and German text (docs/RULES.md, R2)
# Changes to the answers of the model are measured separately with backend/scenarios (see docs/CHANGES.md).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the engine image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          load: true
          tags: starkllm-backend:test
          cache-from: type=gha,scope=checks-backend
          cache-to: type=gha,mode=max,scope=checks-backend
      - name: Tests
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo/backend starkllm-backend:test \
            sh -c "pip install -q pytest && python -m pytest -q -rs tests --ignore=tests/run_rigorous_e2e.py -p no:cacheprovider"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: UI translations complete (every language file), no hidden translator
        run: node scripts/check-i18n.mjs
      - name: Language helpers (choice of language, date and money formats, speech language)
        run: npm test
      - name: Build
        run: npm run build

  accessibility:
    # WCAG 2.1 AA / EN 301 549 (docs/accessibility.md): axe-core on every page, settings section and dialog in every
    # theme, plus keyboard (skip link, dialogs keep and give back the focus), headings and 200 % zoom. The API is
    # simulated, no engine or model is needed.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Playwright and axe-core (only for this check, not in package.json)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.64.1 axe-core@4.14.0
          npx playwright install --with-deps chromium
      - name: Accessibility check
        env:
          # the light themes' contrast is fixed on fix261/theme; remove this line when that is merged
          A11Y_CONTRAST_PENDING: light,doodle,flowers
        run: npm run a11y

  languages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Only English and German in the repository
        run: python3 scripts/check-languages.py

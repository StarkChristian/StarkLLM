name: Backend tests

# Runs the backend tests inside the engine image, so they see the same Python packages and system tools
# (Tesseract with German, PyMuPDF, ffmpeg) as the engine users run.

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the engine image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          load: true
          tags: starkllm-backend:test
          cache-from: |
            type=gha,scope=backend-tests
            type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend-tests

      - name: OCR reads German in the image
        run: docker run --rm starkllm-backend:test tesseract --list-langs | grep -x deu

      - name: Tests
        run: |
          docker run --rm -e STARKLLM_REQUIRE_OCR=1 -v "$PWD:/repo" -w /repo/backend starkllm-backend:test \
            sh -c "pip install -q pytest && python -m pytest -q -rs tests --ignore=tests/run_rigorous_e2e.py -p no:cacheprovider"

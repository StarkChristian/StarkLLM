name: Backend tests

# Runs the backend tests inside the engine image, so they see the same Python packages and system tools
# (Tesseract with German, PyMuPDF, ffmpeg) as the engine users run.

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'tests/injection/**'
      - '.github/workflows/backend-tests.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'tests/injection/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the engine image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          load: true
          tags: starkllm-backend:test
          cache-from: |
            type=gha,scope=backend-tests
            type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend-tests

      - name: OCR reads German in the image
        run: docker run --rm starkllm-backend:test tesseract --list-langs | grep -x deu

      - name: Tests
        run: |
          docker run --rm -e STARKLLM_REQUIRE_OCR=1 -v "$PWD:/repo" -w /repo/backend starkllm-backend:test \
            sh -c "pip install -q pytest && python -m pytest -q -rs tests --ignore=tests/run_rigorous_e2e.py -p no:cacheprovider"

      # Exit test of roadmap phase 3 (provable privacy): the same tests in a container with no network device at all.
      # Nothing in the engine may need, or attempt, a connection to anything but this PC. pytest is installed first,
      # while the network is still there, into a folder that the offline run reads.
      - name: Tests without any network (docker run --network none)
        run: |
          docker run --rm -v "$PWD/.pytest-lib:/pt" starkllm-backend:test pip install -q --target /pt pytest
          docker run --rm --network none -e PYTHONPATH=/pt -e STARKLLM_REQUIRE_OCR=1 -v "$PWD:/repo" -w /repo/backend starkllm-backend:test \
            python -m pytest -q -rs tests --ignore=tests/run_rigorous_e2e.py -p no:cacheprovider

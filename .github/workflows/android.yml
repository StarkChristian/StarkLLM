name: android

# StarkLLM for Android (mobile/android): unit tests and a debug APK for every change of the app.
on:
  pull_request:
    paths:
      - "mobile/android/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "mobile/android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Debug APK and release build (unsigned)
        run: ./gradlew --no-daemon assembleDebug assembleRelease lintDebug
      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: starkllm-android-debug
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            mobile/android/app/build/reports/
            mobile/android/app/build/test-results/
          retention-days: 7

services:
  backend:
    build:
      context: ./backend
    container_name: starkllm-backend
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./knowledge_base_data:/kb_data   # Personal Knowledge Base volume
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - DEFAULT_TEXT_MODEL=${DEFAULT_TEXT_MODEL:-qwen3.8:27b}
      - DEFAULT_VISION_MODEL=${DEFAULT_VISION_MODEL:-llava}
      - DEFAULT_EMBEDDING_MODEL=${DEFAULT_EMBEDDING_MODEL:-qwen3-embedding:0.6b}
      # Security & Privacy: Disable telemetry globally
      - HF_HUB_DISABLE_TELEMETRY=1
      - DO_NOT_TRACK=1
      - ANONYMIZED_TELEMETRY=False
      - SECRET_KEY=${SECRET_KEY:-starkllm_research_beta_secure_fallback_key_2026_change_in_production}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
    container_name: starkllm-frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend

volumes:
  starkllm-data:

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>StarkLLM</title>
<style>
  :root { color-scheme: light dark; --bg:#f3f4f8; --field:#fff; --ink:#1c2230; --muted:#5b6478; --line:#d6d9e6; --accent:#4f46e5; --busy:#0ea5a4; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14161f; --field:#1f2230; --ink:#e7e9f3; --muted:#9aa1b5; --line:#2e3244; } }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:13px 'Segoe UI', system-ui, sans-serif; overflow:hidden; user-select:none; }
  .bar { display:flex; align-items:center; gap:4px; height:48px; padding:0 8px; box-sizing:border-box; border-bottom:1px solid var(--line); }
  button { all:unset; width:32px; height:32px; border-radius:8px; display:grid; place-items:center; cursor:pointer; color:var(--ink); }
  button:hover:not(:disabled) { background:rgba(127,127,160,.18); }
  button:disabled { opacity:.35; cursor:default; }
  button:focus-visible { outline:2px solid var(--accent); }
  svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  form { flex:1; display:flex; align-items:center; gap:6px; height:32px; padding:0 10px; background:var(--field); border:1px solid var(--line); border-radius:16px; }
  form:focus-within { border-color:var(--accent); }
  #lock { width:14px; height:14px; color:var(--muted); flex:none; }
  #lock.secure { color:#16a34a; }
  input { flex:1; border:0; outline:0; background:transparent; color:var(--ink); font:inherit; user-select:text; min-width:0; }
  .task { display:none; align-items:center; gap:6px; padding:0 10px; height:28px; border-radius:14px; background:rgba(14,165,164,.14); color:var(--busy); white-space:nowrap; font-weight:600; }
  .task.on { display:flex; }
  .task.paused { background:rgba(79,70,229,.14); color:var(--accent); }
  .dot { width:8px; height:8px; border-radius:50%; background:currentColor; animation:pulse 1.2s infinite; }
  .task.paused .dot { animation:none; }
  @keyframes pulse { 50% { opacity:.3; } }
  .progress { position:absolute; left:0; top:46px; height:2px; width:0; background:var(--accent); transition:width .4s; }
  .progress.on { width:70%; }
</style>
</head>
<body>
<div class="bar">
  <button id="back" disabled><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
  <button id="forward" disabled><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
  <button id="reload"><svg id="reloadIcon" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg><svg id="stopIcon" viewBox="0 0 24 24" style="display:none"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
  <button id="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></button>
  <form id="form">
    <svg id="lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    <input id="address" spellcheck="false" autocomplete="off">
  </form>
  <div class="task" id="task"><span class="dot"></span><span id="taskText"></span></div>
</div>
<div class="progress" id="progress"></div>
<script src="webtask-bar.js"></script>
</body>
</html>

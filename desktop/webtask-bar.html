<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>StarkLLM</title>
<style>
  :root { color-scheme: light dark; --bg:#f3f4f8; --strip:#e4e6ee; --field:#fff; --ink:#1c2230; --muted:#5b6478; --line:#d6d9e6; --accent:#4f46e5; --busy:#0ea5a4; --hover:rgba(127,127,160,.18); --danger:#c2410c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14161f; --strip:#0d0f16; --field:#1f2230; --ink:#e7e9f3; --muted:#9aa1b5; --line:#2e3244; --danger:#fb923c; } }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:13px 'Segoe UI', system-ui, sans-serif; overflow:hidden; user-select:none; }
  button { all:unset; width:32px; height:32px; border-radius:8px; display:grid; place-items:center; cursor:pointer; color:var(--ink); flex:none; }
  button:hover:not(:disabled) { background:var(--hover); }
  button:disabled { opacity:.35; cursor:default; }
  button:focus-visible, .tab:focus-visible, .fav:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }
  svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .hide { display:none !important; }

  /* tabs */
  .tabs { display:flex; align-items:flex-end; gap:2px; height:36px; padding:0 6px; box-sizing:border-box; background:var(--strip); overflow:hidden; }
  .tab { display:flex; align-items:center; gap:6px; flex:1 1 200px; max-width:220px; min-width:44px; height:30px; padding:0 4px 0 10px; box-sizing:border-box; border-radius:8px 8px 0 0; cursor:default; color:var(--muted); overflow:hidden; }
  .tab:hover { background:var(--hover); }
  .tab.on { background:var(--bg); color:var(--ink); }
  .tab .letter { width:16px; height:16px; border-radius:4px; flex:none; display:grid; place-items:center; font-size:10px; font-weight:700; background:var(--line); color:var(--ink); text-transform:uppercase; }
  .tab .letter.loading { background:transparent; border:2px solid var(--line); border-top-color:var(--accent); border-radius:50%; width:12px; height:12px; animation:spin .8s linear infinite; font-size:0; }
  .tab .letter.task { background:var(--busy); color:#fff; }
  .tab .letter.task.paused { background:var(--accent); }
  @keyframes spin { to { transform:rotate(360deg); } }
  .tab .title { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tab button { width:20px; height:20px; border-radius:5px; }
  .tab button svg { width:12px; height:12px; }
  #newTab { width:28px; height:28px; margin:0 0 1px 2px; }

  /* address bar */
  .bar { display:flex; align-items:center; gap:2px; height:44px; padding:0 8px; box-sizing:border-box; }
  form { flex:1; display:flex; align-items:center; gap:6px; height:32px; margin:0 4px; padding:0 4px 0 10px; background:var(--field); border:1px solid var(--line); border-radius:16px; min-width:120px; }
  form:focus-within { border-color:var(--accent); }
  #lock { width:14px; height:14px; color:var(--muted); flex:none; }
  #lock.secure { color:#16a34a; }
  input { flex:1; border:0; outline:0; background:transparent; color:var(--ink); font:inherit; user-select:text; min-width:0; }
  form button { width:26px; height:26px; border-radius:13px; }
  #star.on svg { fill:#eab308; stroke:#eab308; }
  #zoom { all:unset; cursor:pointer; padding:0 8px; height:22px; line-height:22px; border-radius:11px; background:var(--hover); font-size:12px; flex:none; }
  .task { display:none; align-items:center; gap:6px; padding:0 10px; height:28px; border-radius:14px; background:rgba(14,165,164,.14); color:var(--busy); white-space:nowrap; font-weight:600; }
  .task.on { display:flex; }
  .task.paused { background:rgba(79,70,229,.14); color:var(--accent); }
  .dot { width:8px; height:8px; border-radius:50%; background:currentColor; animation:pulse 1.2s infinite; }
  .task.paused .dot { animation:none; }
  @keyframes pulse { 50% { opacity:.3; } }
  #downloads { position:relative; }
  #downloads .badge { position:absolute; right:3px; top:3px; width:8px; height:8px; border-radius:50%; background:var(--busy); }
  .progress { position:absolute; left:0; height:2px; width:0; background:var(--accent); transition:width .4s; }
  .progress.on { width:70%; }

  /* favourites bar */
  .favs { display:flex; align-items:center; gap:2px; height:30px; padding:0 8px; box-sizing:border-box; overflow:hidden; border-top:1px solid var(--line); }
  .fav { all:unset; display:flex; align-items:center; gap:6px; max-width:180px; height:24px; padding:0 8px; border-radius:12px; cursor:pointer; white-space:nowrap; flex:none; }
  .fav:hover { background:var(--hover); }
  .fav span { overflow:hidden; text-overflow:ellipsis; }
  .fav .letter { width:14px; height:14px; border-radius:3px; display:grid; place-items:center; font-size:9px; font-weight:700; background:var(--line); text-transform:uppercase; flex:none; }
  .favs .more { margin-left:auto; }

  /* find */
  .find { display:flex; align-items:center; gap:4px; height:40px; padding:0 8px; box-sizing:border-box; border-top:1px solid var(--line); }
  .find input { flex:0 1 320px; height:28px; padding:0 10px; background:var(--field); border:1px solid var(--line); border-radius:14px; }
  .find input:focus { border-color:var(--accent); }
  #findCount { color:var(--muted); min-width:80px; padding:0 6px; }

  .edge { border-bottom:1px solid var(--line); }

  /* panels: favourites, history, downloads */
  .panel { position:absolute; left:0; right:0; bottom:0; overflow:auto; background:var(--bg); user-select:text; }
  .panel .inner { max-width:860px; margin:0 auto; padding:20px 24px 40px; }
  .panel h2 { margin:0; font-size:20px; font-weight:600; flex:1; }
  .panel .head { display:flex; align-items:center; gap:8px; margin-bottom:14px; }
  .panel .note { color:var(--muted); font-size:12px; margin-top:18px; }
  .panel .empty { color:var(--muted); padding:24px 0; }
  .panel .day { color:var(--muted); font-weight:600; margin:16px 0 4px; }
  .row { display:flex; align-items:center; gap:10px; min-height:40px; padding:4px 8px; border-radius:8px; }
  .row:hover { background:var(--hover); }
  .row .main { flex:1; min-width:0; cursor:pointer; }
  .row .t { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .u { color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .time { color:var(--muted); font-size:12px; width:72px; flex:none; white-space:nowrap; }
  .row.dragging { opacity:.4; }
  .row .edit { flex:1; display:grid; gap:4px; }
  .row .edit input, .search { height:30px; padding:0 10px; background:var(--field); border:1px solid var(--line); border-radius:8px; }
  .search { width:100%; box-sizing:border-box; margin-bottom:8px; }
  .text { all:unset; cursor:pointer; padding:0 12px; height:30px; line-height:30px; border-radius:8px; color:var(--accent); font-weight:600; white-space:nowrap; flex:none; }
  .text:hover { background:var(--hover); }
  .text.danger { color:var(--danger); }
  .error { color:var(--danger); font-size:12px; }
  label.check { display:flex; align-items:center; gap:8px; color:var(--muted); }
</style>
</head>
<body>
<div class="tabs" id="tabs"><button id="newTab"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div>
<div class="bar edge" id="toolbar">
  <button id="back" disabled><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
  <button id="forward" disabled><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
  <button id="reload"><svg id="reloadIcon" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg><svg id="stopIcon" viewBox="0 0 24 24" style="display:none"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
  <button id="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></button>
  <form id="form">
    <svg id="lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    <input id="address" spellcheck="false" autocomplete="off">
    <button type="button" id="zoom" class="hide"></button>
    <button type="button" id="star"><svg viewBox="0 0 24 24"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z"/></svg></button>
  </form>
  <div class="task" id="task"><span class="dot"></span><span id="taskText"></span></div>
  <button id="external"><svg viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></button>
  <button id="favourites"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg></button>
  <button id="history"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></button>
  <button id="downloads"><svg viewBox="0 0 24 24"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg><span class="badge hide" id="dlBadge"></span></button>
  <button id="menu"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>
</div>
<div class="progress" id="progress"></div>
<div class="favs edge hide" id="favs"></div>
<div class="find edge hide" id="find">
  <input id="findText" spellcheck="false" autocomplete="off">
  <span id="findCount"></span>
  <button id="findPrev"><svg viewBox="0 0 24 24"><path d="M18 15l-6-6-6 6"/></svg></button>
  <button id="findNext"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
  <button id="findClose"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
</div>
<div class="panel hide" id="panel"><div class="inner" id="panelInner"></div></div>
<script src="webtask-bar.js"></script>
</body>
</html>

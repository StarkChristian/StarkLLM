<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>StarkLLM</title>
  <style>
    @font-face { font-family: 'Geist'; src: url('assets/fonts/geist-latin-wght-normal.woff2') format('woff2-variations'); font-weight: 100 900; }
    @font-face { font-family: 'Geist Mono'; src: url('assets/fonts/geist-mono-latin-wght-normal.woff2') format('woff2-variations'); font-weight: 100 900; }
    :root {
      --bg: #07060b;
      --fg: #f2eefb;
      --muted: #9d96b6;
      --violet: #8c14fc;
      --violet-soft: #b777ff;
      --gold: #d4af37;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background:
        radial-gradient(60% 50% at 50% 42%, rgba(140, 20, 252, .16), transparent 70%),
        radial-gradient(40% 30% at 50% 46%, rgba(212, 175, 55, .06), transparent 70%),
        var(--bg);
      color: var(--fg);
      font-family: 'Geist', 'Segoe UI', system-ui, sans-serif;
      display: grid;
      place-items: center;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
      transition: opacity .35s ease;
    }
    body.leaving { opacity: 0; }
    .stage { display: flex; flex-direction: column; align-items: center; text-align: center; animation: rise 1s cubic-bezier(.2, .7, .2, 1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.97); } to { opacity: 1; transform: none; } }

    .mark { position: relative; width: min(300px, 46vw); aspect-ratio: 16 / 9; filter: drop-shadow(0 18px 40px rgba(140, 20, 252, .28)); }
    .mark img { width: 100%; height: 100%; object-fit: contain; display: block; }
    /* a band of light that moves across the silver, clipped to the logo's shape */
    .mark .shine {
      position: absolute; inset: 0;
      -webkit-mask: url('assets/logo-mark.png') center / contain no-repeat;
      mask: url('assets/logo-mark.png') center / contain no-repeat;
      background: linear-gradient(105deg, transparent 38%, rgba(255, 255, 255, .75) 50%, transparent 62%);
      background-size: 260% 100%;
      background-position: 120% 0;
      mix-blend-mode: screen;
      animation: sweep 3.2s ease-in-out 0.6s infinite;
    }
    @keyframes sweep { 0% { background-position: 120% 0; } 55%, 100% { background-position: -20% 0; } }

    h1 { margin-top: 2.2rem; font-size: 2.6rem; font-weight: 650; letter-spacing: -.04em; }
    .tagline { margin-top: .5rem; color: var(--muted); font-size: 1rem; }

    .progress { margin-top: 2.6rem; width: 260px; height: 2px; border-radius: 2px; background: rgba(255, 255, 255, .08); overflow: hidden; }
    .progress i { display: block; width: 35%; height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--violet), var(--violet-soft), var(--gold)); animation: slide 1.6s ease-in-out infinite; }
    @keyframes slide { from { transform: translateX(-110%); } to { transform: translateX(300%); } }

    .status { margin-top: 1rem; min-height: 1.3rem; max-width: 560px; padding-inline: 1rem; font: 400 .82rem/1.5 'Geist Mono', Consolas, monospace; color: var(--muted); overflow-wrap: anywhere; }
    .version { position: fixed; bottom: 1.4rem; left: 0; right: 0; text-align: center; font: 500 .72rem 'Geist Mono', Consolas, monospace; letter-spacing: .14em; text-transform: uppercase; color: rgba(157, 150, 182, .7); }

    @media (prefers-reduced-motion: reduce) {
      .stage, .mark .shine, .progress i { animation: none; }
      .progress i { width: 100%; opacity: .5; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <div class="mark"><img src="assets/logo-mark.png" alt=""><span class="shine"></span></div>
    <h1>StarkLLM</h1>
    <p class="tagline">Private, local-first AI for your documents</p>
    <div class="progress" aria-hidden="true"><i></i></div>
    <p class="status" id="statusMsg" role="status" aria-live="polite">Starting...</p>
  </main>
  <p class="version" id="versionBadge">Desktop</p>
</body>
</html>
